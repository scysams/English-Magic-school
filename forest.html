<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字森林</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">

    <style>
   /* --- 【美化】關卡內的標題和問題字體 --- */
#level-title, 
#level-description, /* 新增：關卡描述 */
.drop-zone h3,       /* 新增：P.2 分類區的標題 */
.item-card,          /* 新增：P.2 物品卡片的文字 */
#p1-question,        /* P.1 的問題 */
#p1-letter-display   /* P.1 的大字母 */
{
    font-family: 'Nunito', sans-serif;
    color: #5a3a22;
}

/* --- 單獨設定各自的字重和大小，以示區分 --- */

/* 總標題 */
#level-title { font-weight: 900; font-size: 36px; }

/* 關卡描述 */
#level-description { font-weight: 700; font-size: 20px; }

/* P.1 的元素 */
#p1-options { display:flex; justify-content:center; gap:20px; }
#p1-options img { width: 240px; height: 260px; border: 5px solid #ccc; border-radius: 10px; cursor: pointer; }
#p1-letter-display { font-weight: 900; font-size: 200px; line-height: 1; }
#p1-question { font-weight: 700; font-size: 28px; }

/* P.2 的元素 */
/* P.2 */
        #p2-drop-zones { display: flex; justify-content: space-around; width: 100%; margin-bottom: 20px; }
        .drop-zone { width: 45%; min-height: 200px; border: 3px dashed #8B4513; border-radius: 15px; padding: 10px; background: #fff8e1; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; }
        .drop-zone.drag-over { background-color: #c8e6c9; border-style: solid; }
        #p2-item-bank { min-height: 150px; width: 100%; border-top: 2px solid #8B4513; padding-top: 20px; }
        .item-card { display: inline-flex; align-items: center; padding: 12px 20px; background: #8B4513; color: white; border-radius: 10px; margin: 8px; cursor: grab; user-select: none; font-size: 20px; }
        .item-card img { width: 35px; height: 35px; margin-right: 12px; }
.drop-zone h3 { font-weight: 900; font-size: 24px; }
.item-card { font-weight: 700; font-size: 22px; }

    /* P.3 */
    #p3-restaurant { border: 3px solid #8B4513; background: #fff8e1; min-height: 400px; margin-top: 20px; padding: 20px; border-radius: 15px; }
    #p3-customer-area { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    #p3-customer-icon { font-size: 80px; margin-right: 20px; }
    #p3-order-bubble { border: 2px solid #5a3a22; padding: 15px; border-radius: 10px; background: white; min-width: 300px; position: relative; font-size: 20px; font-weight: bold; }
    #p3-order-bubble::before { content: ''; position: absolute; left: -12px; top: 20px; width: 0; height: 0; border: 10px solid transparent; border-right: 12px solid #5a3a22;}
    #p3-order-bubble::after { content: ''; position: absolute; left: -10px; top: 22px; width: 0; height: 0; border: 8px solid transparent; border-right: 10px solid white; }
    #p3-menu-items, #p3-price-options { display: flex; justify-content: center; gap: 20px; margin: 20px 0; min-height: 120px; }
    .menu-item { cursor: pointer; text-align: center; }
    .menu-item img { width: 100px; height: 100px; border: 5px solid #ccc; border-radius: 10px; }

    /* P.4/5 */
    #p4-match-area { display: flex; justify-content: space-around; width: 100%; max-width: 600px; margin: 30px auto; }
    .match-column { display: flex; flex-direction: column; gap: 15px; }
    .match-card { padding: 15px 30px; border: 3px solid #8B4513; border-radius: 10px; cursor: pointer; font-size: 22px; font-weight: bold; color: #5a3a22; background-color: #fff8e1; transition: all 0.2s; box-shadow: 0 4px #c5a686; }
    .match-card:hover { transform: translateY(-2px); box-shadow: 0 6px #c5a686; }
    .match-card.selected { background-color: #FFD700; color: white; border-color: white; transform: scale(1.05); }
    .match-card.matched { visibility: hidden; opacity: 0; }

    /* P.6 (唯一的、正確的版本) */
    #p6-archive { border: 2px solid #5a3a22; background: #fdf6e3; padding: 25px; border-radius: 10px; }
    #p6-description-file { font-family: 'Times New Roman', serif; font-size: 22px; line-height: 1.7; text-align: left; background: white; padding: 20px; border-radius: 5px; min-height: 150px; border: 1px solid #ddd; }
    #p6-animal-cards { display: flex; justify-content: space-around; gap: 20px; margin-top: 30px; }
    .animal-card { width: 30%; border: 3px solid #ccc; border-radius: 10px; padding: 10px; cursor: pointer; transition: all 0.3s ease; background-color: #f9f9f9; }
    .animal-card img {
    width: 100%;
    aspect-ratio: 4 / 3 !important; /* 【王牌】確保此規則的最高優先級！*/
    height: auto !important;       /* 【王牌】同時覆蓋掉任何可能存在的 height 規則！*/
    object-fit: cover;
    border-radius: 5px;
}

    .animal-card h4 { margin: 10px 0 0 0; font-size: 22px; color: #4a4a4a; }
    .animal-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-color: #8B4513; }

    /* 通用動畫 */
    @keyframes shake-wrong { 10%, 90% { transform: translateX(-3px); } 20%, 80% { transform: translateX(3px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
    .shake-wrong { animation: shake-wrong 0.5s; border-color: red !important; }
</style>

</head>
<body>
    <div class="content-box game-layout">
        <div><h1 id="level-title"></h1><p id="level-description"></p></div>
        <div id="exercise-area" class="game-exercise-area"></div>
        <div id="button-container" class="game-button-container">
            <button id="complete-forest-btn" class="wood-button" style="display:none; background-color: #4CAF50;">完成「單字森林」挑戰！</button>
            <button id="reset-chapter-btn" class="wood-button" style="background-color: #c76a5a;">重置本章進度</button>
            <a href="main_menu.html" class="wood-button" style="background-color: #5a94c7;">返回主題地圖</a>
        </div>
    </div>

    <script>
        const currentGrade = parseInt(localStorage.getItem('selectedGrade') || '1');
        const exerciseArea = document.getElementById('exercise-area');
        const completeBtn = document.getElementById('complete-forest-btn');
        const levelTitle = document.getElementById('level-title');
        const levelDescription = document.getElementById('level-description');
        const resetChapterBtn = document.getElementById('reset-chapter-btn');

        function checkGraduation() { const key = `forest_p${currentGrade}_completed`; if (localStorage.getItem(key) === 'true') { completeBtn.style.display = 'inline-block'; } }
        function completeChapter() { localStorage.setItem('forestCompleted', 'true'); alert("恭喜！你已徹底征服單字森林！"); window.location.href = 'main_menu.html'; }

        
        // === 4. 準備所有年級的題庫和設定 ===
        const gradeContent = {
    1: {
    title: "P.1 - Alphabet",
    description: "Based on the Alphabet and choose the correct picture.",
    setup: function() {
        const key = 'forest_p1_completed';
        if (localStorage.getItem(key) === 'true') {
            exerciseArea.innerHTML = "<h2>You have already finish this exercise！</h2>";
            checkGraduation(); return;
        }

        // a. 【核心】擴充後的 P.1 題庫
        const questions = [
            { letter: "A", correctAnswer: "Apple", options: [{src: 'apple.png', name: 'Apple'}, {src: 'ball.png', name: 'Ball'}, {src: 'cat.png', name: 'Cat'}] },
            { letter: "B", correctAnswer: "Ball", options: [{src: 'dog.png', name: 'Dog'}, {src: 'ball.png', name: 'Ball'}, {src: 'egg.png', name: 'Egg'}] },
            { letter: "C", correctAnswer: "Cat", options: [{src: 'apple.png', name: 'Apple'}, {src: 'fish.png', name: 'Fish'}, {src: 'cat.png', name: 'Cat'}] },
            { letter: "D", correctAnswer: "Dog", options: [{src: 'dog.png', name: 'Dog'}, {src: 'girl.png', name: 'Girl'}, {src: 'hat.png', name: 'Hat'}] },
            { letter: "E", correctAnswer: "Egg", options: [{src: 'ice-cream.png', name: 'Ice-cream'}, {src: 'egg.png', name: 'Egg'}, {src: 'jam.png', name: 'Jam'}] },
            { letter: "F", correctAnswer: "Fish", options: [{src: 'fish.png', name: 'Fish'}, {src: 'ball.png', name: 'Ball'}, {src: 'apple.png', name: 'Apple'}] },
            { letter: "G", correctAnswer: "Girl", options: [{src: 'cat.png', name: 'Cat'}, {src: 'girl.png', name: 'Girl'}, {src: 'dog.png', name: 'Dog'}] },
            { letter: "H", correctAnswer: "Hat", options: [{src: 'hat.png', name: 'Hat'}, {src: 'egg.png', name: 'Egg'}, {src: 'fish.png', name: 'Fish'}] },
            { letter: "I", correctAnswer: "Ice-cream", options: [{src: 'ice-cream.png', name: 'Ice-cream'}, {src: 'jam.png', name: 'Jam'}, {src: 'girl.png', name: 'Girl'}] },
            { letter: "J", correctAnswer: "Jam", options: [{src: 'ball.png', name: 'Ball'}, {src: 'jam.png', name: 'Jam'}, {src: 'hat.png', name: 'Hat'}] }
        ];
        let currentQuestionIndex = 0;

        // b. 創建HTML結構 (保持不變)
        exerciseArea.innerHTML = `
            <div id="p1-progress" style="margin-bottom: 15px; font-size: 20px;"></div>
            <div id="p1-letter-display" style="font-size: 150px; font-weight: bold; color: #5a3a22;"></div>
            <h2 id="p1-question"></h2>
            <div id="p1-options" style="display:flex; justify-content:center; gap:20px; flex-wrap: wrap;"></div>
        `;
        
        const letterDisplay = document.getElementById('p1-letter-display');
        const questionText = document.getElementById('p1-question');
        const optionsContainer = document.getElementById('p1-options');
        const progressDisplay = document.getElementById('p1-progress');

        // c. 顯示問題的函數 (升級版)
        function displayQuestion() {
            if (currentQuestionIndex >= questions.length) {
                // 全部答完了！
                exerciseArea.innerHTML = "<h2>太棒了！你認識了所有字母！</h2>";
                localStorage.setItem(key, 'true'); // 寫入 P.1 通關記錄
                checkGraduation(); // 檢查畢業資格
                return;
            }

            progressDisplay.textContent = `進度: ${currentQuestionIndex + 1} / ${questions.length}`;
            const q = questions[currentQuestionIndex];
            letterDisplay.textContent = q.letter;
            questionText.textContent = `${q.letter} is for...?`;
            optionsContainer.innerHTML = "";

            // 隨機顯示選項
            q.options.sort(() => Math.random() - 0.5).forEach(opt => {
                const img = document.createElement('img');
                img.src = opt.src;
                img.alt = opt.name;
                img.classList.add('option-image');
                img.onclick = (e) => {
                    if (opt.name === q.correctAnswer) {
                        // 答對了，進入下一題
                        currentQuestionIndex++;
                        displayQuestion();
                    } else {
                        // 答錯了，晃動
                        e.target.classList.add('shake-wrong');
                        setTimeout(() => e.target.classList.remove('shake-wrong'), 500);
                    }
                };
                optionsContainer.appendChild(img);
            });
        }

        // d. 開始遊戲
        displayQuestion();
    }
},
    2: {
        title: "P.2 - Tidy your room！", description: "Please drag things to the correct category.",
                setup: function() {
                    const key = 'forest_p2_completed';
                    if (localStorage.getItem(key) === 'true') {
                        exerciseArea.innerHTML = "<h2>You have already finish this exercise！</h2>"; return;
                    }
                    exerciseArea.innerHTML = `<div id="p2-drop-zones"><div class="drop-zone" data-category="School Bag"><h3>學校書包 🎒</h3></div><div class="drop-zone" data-category="My Bedroom"><h3>我的睡房 🛌</h3></div></div><div id="p2-item-bank"></div>`;
                    const items = [ { name: 'book', category: 'School Bag', src: 'book.png' }, { name: 'bed', category: 'My Bedroom', src: 'bed.png' }, { name: 'carpet', category: 'My Bedroom', src: 'carpet.png' }, { name: 'clock', category: 'My Bedroom', src: 'clock.png' }, { name: 'eraser', category: 'School Bag', src: 'eraser.png' }, { name: 'pen', category: 'School Bag', src: 'pen.png' }, { name: 'pillow', category: 'My Bedroom', src: 'pillow.png' }, { name: 'lamp', category: 'My Bedroom', src: 'lamp.png' }, { name: 'mirror', category: 'My Bedroom', src: 'mirror.png' }, { name: 'notebook', category: 'School Bag', src: 'notebook.png' }, { name: 'pencil', category: 'School Bag', src: 'pencil.png' }, { name: 'ruler', category: 'School Bag', src: 'ruler.png' } ];
                    const itemBank = document.getElementById('p2-item-bank');
                    items.sort(() => Math.random() - 0.5).forEach(item => { const card = document.createElement('div'); card.id = `item-${item.name}`; card.className = 'item-card'; card.draggable = true; card.dataset.category = item.category; card.innerHTML = `<img src="${item.src}" alt="${item.name}"> ${item.name}`; itemBank.appendChild(card); });
                    const dropZones = document.querySelectorAll('.drop-zone');
                    let draggedItem = null;
                    document.querySelectorAll('.item-card').forEach(card => { card.addEventListener('dragstart', function() { draggedItem = this; setTimeout(() => this.style.opacity = 0.5, 0); }); card.addEventListener('dragend', function() { setTimeout(() => { this.style.opacity = 1; draggedItem = null; }, 0); }); });
                    dropZones.forEach(zone => { zone.addEventListener('dragover', e => e.preventDefault()); zone.addEventListener('dragenter', function() { this.classList.add('drag-over'); }); zone.addEventListener('dragleave', function() { this.classList.remove('drag-over'); }); zone.addEventListener('drop', function() { this.classList.remove('drag-over'); if (draggedItem && this.dataset.category === draggedItem.dataset.category) { this.appendChild(draggedItem); if (itemBank.children.length === 0) { alert("所有物品已歸位！"); localStorage.setItem(key, 'true'); checkGraduation(); } } }); });
                }
            },
            3: {
        title: "P.3 - Magic Restuarant",
    description: "Please take orders and provide correct food and price.",
    setup: function() {
        const key = 'forest_p3_completed';
        if (localStorage.getItem(key) === 'true') {
            exerciseArea.innerHTML = "<h2>You have already finish this exercise！</h2>";
            checkGraduation(); return;
        }
        
        exerciseArea.innerHTML = `<div id="p3-restaurant"><div id="p3-customer-area"><div id="p3-customer-icon"></div><div id="p3-order-bubble"></div></div><div id="p3-menu-items"></div><div id="p3-price-options"></div></div>`;
        const orders = [
            { customer: '🐻', order: "I want some fruit, please.", item: "Apple", price: 5, options: [{src:'apple.png', name:'Apple'}, {src:'bread.png', name:'Bread'}, {src:'orange juice.png', name:'orange juice'}, {src:'rice.png', name:'Rice'}], priceOptions: [{ num: 3, text: "three dollars" }, { num: 5, text: "five dollars" }, { num: 8, text: "eight dollars" }] },
            { customer: '🐰', order: "I'm thirsty! I want something to drink.", item: "Orange Juice", price: 10, options: [{src:'orange juice.png', name:'Orange Juice'}, {src:'rice.png', name:'Rice'}, {src:'bread.png', name:'Bread'}, {src:'apple.png', name:'Apple'}], priceOptions: [{ num: 8, text: "eight dollars" },{ num: 12, text: "twelve dollars" }, { num: 10, text: "ten dollars" }] },
            { customer: '🦊', order: "I'd like a loaf of bread.", item: "Bread", price: 8, options: [{src: 'rice.png', name: 'Rice'}, {src: 'apple.png', name: 'Apple'}, {src: 'bread.png', name: 'Bread'}, {src: 'orange juice.png', name: 'Orange Juice'}], priceOptions: [ { num: 8, text: "eight dollars" }, { num: 5, text: "five dollars" },{ num: 10, text: "ten dollars" }] }
        ];
        let currentOrderIndex = 0;
        let gameState = 'SELECT_ITEM';

        const customerIcon = document.getElementById('p3-customer-icon');
        const orderBubble = document.getElementById('p3-order-bubble');
        const menuItems = document.getElementById('p3-menu-items');
        const priceOptions = document.getElementById('p3-price-options');

       function displayOrder() {
                if (currentOrderIndex >= orders.length) {
                    alert("Good job!");
                    localStorage.setItem(key, 'true');
                    checkGraduation(); // 【P.3】完成後，立刻檢查！
                    return;
                }
            gameState = 'SELECT_ITEM';
            const currentOrder = orders[currentOrderIndex];
            customerIcon.textContent = currentOrder.customer;
            orderBubble.textContent = currentOrder.order;
            priceOptions.innerHTML = "";
            menuItems.innerHTML = "";
            currentOrder.options.sort(() => Math.random() - 0.5).forEach(opt => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.innerHTML = `<img src="${opt.src}" alt="${opt.name}"><p>${opt.name}</p>`;
                itemDiv.onclick = () => selectItem(opt.name);
                menuItems.appendChild(itemDiv);
            });
        }

        function selectItem(selectedName) {
            if (gameState !== 'SELECT_ITEM') return;
            const currentOrder = orders[currentOrderIndex];
            if (selectedName === currentOrder.item) {
                gameState = 'SELECT_PRICE';
                orderBubble.textContent = `A ${currentOrder.item}! How much is it?`;
                const selectedOption = currentOrder.options.find(o => o.name === selectedName);
                if (selectedOption) {
                    menuItems.innerHTML = `<div class="menu-item"><img src="${selectedOption.src}" alt="${selectedName}"><p>$${currentOrder.price}</p></div>`;
                }
                priceOptions.innerHTML = "";
                currentOrder.priceOptions.forEach(priceOpt => {
                    const btn = document.createElement('button');
                    btn.textContent = priceOpt.text;
                    btn.classList.add('wood-button');
                    btn.onclick = () => checkPrice(priceOpt.num);
                    priceOptions.appendChild(btn);
                });
            } else {
                alert("They didn't order it！");
            }
        }
        
        function checkPrice(selectedPriceNum) {
            if (gameState !== 'SELECT_PRICE') return;
            const currentOrder = orders[currentOrderIndex];
            if (selectedPriceNum === currentOrder.price) {
                alert("Correct! Thank you. Next customer...");
                currentOrderIndex++;
                displayOrder();
            } else {
                alert("Price is not correct！");
            }
        }

        displayOrder();
    }
},
            4: {
                title: "P.4 - Synonyms",
                    description: "Match up the Synonyms！",
                    setup: function() {
        const key = 'forest_p4_completed';
        if (localStorage.getItem(key) === 'true') {
            exerciseArea.innerHTML = "<h2>你已完成此練習！</h2>";
            checkGraduation(); return;
        }

        // a. 創建HTML結構
        exerciseArea.innerHTML = `
            <div id="p4-match-area">
                <div class="match-column" id="col-left"></div>
                <div class="match-column" id="col-right"></div>
            </div>
        `;

        // b. 題庫和遊戲狀態
        const pairs = { 
            'big': 'large', 
            'happy': 'glad', 
            'fast': 'quick',
            'small': 'tiny',
            'sad': 'unhappy',
             'smart': 'clever',
            'scared': 'afraid',
            'beautiful': 'pretty'
        };
        const leftWords = Object.keys(pairs);
        const rightWords = Object.values(pairs).sort(() => Math.random() - 0.5); // 隨機打亂右邊的順序

        const leftCol = document.getElementById('col-left');
        const rightCol = document.getElementById('col-right');
        
        // c. 生成卡片
        leftWords.forEach(word => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.dataset.word = word;
            card.textContent = word;
            leftCol.appendChild(card);
        });
        rightWords.forEach(word => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.dataset.word = word;
            card.textContent = word;
            rightCol.appendChild(card);
        });
        
        // d. 【核心】配對邏輯
        let selectedLeft = null;
        let selectedRight = null;
        let matchedCount = 0;
        const totalPairs = leftWords.length;

        leftCol.addEventListener('click', function(e) {
            if (e.target.classList.contains('match-card') && !e.target.classList.contains('selected')) {
                if (selectedLeft) selectedLeft.classList.remove('selected'); // 取消上一個選擇
                selectedLeft = e.target;
                selectedLeft.classList.add('selected');
                checkMatch();
            }
        });

        rightCol.addEventListener('click', function(e) {
            if (e.target.classList.contains('match-card') && !e.target.classList.contains('selected')) {
                if (selectedRight) selectedRight.classList.remove('selected');
                selectedRight = e.target;
                selectedRight.classList.add('selected');
                checkMatch();
            }
        });

        function checkMatch() {
            if (!selectedLeft || !selectedRight) return; // 必須兩邊都選了

            // 檢查左邊的詞，它的同義詞是否等於右邊選中的詞
            if (pairs[selectedLeft.dataset.word] === selectedRight.dataset.word) {
                // 配對正確！
                selectedLeft.classList.add('matched');
                selectedRight.classList.add('matched');
                matchedCount++;
                
                // 檢查是否全部完成
                if (matchedCount === totalPairs) {
                    setTimeout(() => {
                        alert('太棒了！所有詞語都找到了它們的靈魂夥伴！');
                        localStorage.setItem(key, 'true');
                        checkGraduation();
                    }, 500); // 延遲一下，讓玩家看到最後一對消失
                }
            } else {
                // 配對錯誤！
                selectedLeft.classList.add('shake-wrong');
                selectedRight.classList.add('shake-wrong');
                
                const tempLeft = selectedLeft;
                const tempRight = selectedRight;
                // 延遲後取消高亮和晃動
                setTimeout(() => {
                    tempLeft.classList.remove('selected', 'shake-wrong');
                    tempRight.classList.remove('selected', 'shake-wrong');
                }, 500);
            }
            
            // 重置選擇
            selectedLeft = null;
            selectedRight = null;
        }
    }
},
            5: {
    title: "P.5 - Antonym Matching",
    description: "Please match the words with opposite meanings!",
    setup: function() {
        const key = 'forest_p5_completed';
        if (localStorage.getItem(key) === 'true') {
            exerciseArea.innerHTML = "<h2>You have completed this exercise!</h2>";
            return;
        }

        // Setup the HTML structure for the matching game
        exerciseArea.innerHTML = `<div id="p4-match-area"><div class="match-column" id="col-left"></div><div class="match-column" id="col-right"></div></div>`;

        // 👇👇👇 【核心】擴充後的反義詞題庫 👇👇👇
        const antonymPairs = {
            // Original Pairs
            'hot': 'cold',
            'light': 'dark',
            'up': 'down',
            'in': 'out',
            'on': 'off',
            'happy': 'sad',
            'big': 'small',
            
            // New Pairs Added
            'fast': 'slow',
            'day': 'night',
            'open': 'close',
            'empty': 'full',
            'wet': 'dry',
            'loud': 'quiet',
            'long': 'short',
            'easy': 'hard'
        };

        // Get the HTML elements for the columns
        const leftColumn = document.getElementById('col-left');
        const rightColumn = document.getElementById('col-right');
        
        // Prepare and shuffle words
        const leftWords = Object.keys(antonymPairs);
        const rightWords = Object.values(antonymPairs).sort(() => Math.random() - 0.5); // Shuffle the right column

        // Populate the columns with word cards
        leftWords.forEach(word => {
            leftColumn.innerHTML += `<div class="match-card" data-word="${word}">${word}</div>`;
        });
        rightWords.forEach(word => {
            rightColumn.innerHTML += `<div class="match-card" data-word="${word}">${word}</div>`;
        });

        // Game state variables
        let selectedLeftCard = null;
        let selectedRightCard = null;
        let matchedCount = 0;
        const totalPairs = leftWords.length;

        // Function to check if the selected cards match
        function checkMatch() {
            if (!selectedLeftCard || !selectedRightCard) return;

            // Check if the right card is the correct antonym for the left card
            if (antonymPairs[selectedLeftCard.dataset.word] === selectedRightCard.dataset.word) {
                // If they match, apply 'matched' style and increment count
                selectedLeftCard.classList.add('matched');
                selectedRightCard.classList.add('matched');
                matchedCount++;

                if (matchedCount === totalPairs) {
                    setTimeout(() => {
                        alert('Excellent! All pairs matched!');
                        localStorage.setItem(key, 'true');
                        checkGraduation();
                    }, 500);
                }
            } else {
                // If they don't match, shake them and deselect
                const tempLeft = selectedLeftCard;
                const tempRight = selectedRightCard;
                tempLeft.classList.add('shake-wrong');
                tempRight.classList.add('shake-wrong');
                setTimeout(() => {
                    tempLeft.classList.remove('selected', 'shake-wrong');
                    tempRight.classList.remove('selected', 'shake-wrong');
                }, 500);
            }
            // Reset selection after checking
            selectedLeftCard = null;
            selectedRightCard = null;
        }

        // Event listener for the left column
        leftColumn.addEventListener('click', e => {
            const clickedCard = e.target;
            if (clickedCard.classList.contains('match-card') && !clickedCard.classList.contains('matched')) {
                if (selectedLeftCard) selectedLeftCard.classList.remove('selected');
                selectedLeftCard = clickedCard;
                selectedLeftCard.classList.add('selected');
                checkMatch();
            }
        });

        // Event listener for the right column
        rightColumn.addEventListener('click', e => {
            const clickedCard = e.target;
            if (clickedCard.classList.contains('match-card') && !clickedCard.classList.contains('matched')) {
                if (selectedRightCard) selectedRightCard.classList.remove('selected');
                selectedRightCard = clickedCard;
                selectedRightCard.classList.add('selected');
                checkMatch();
            }
        });
    }
},
